on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to create branch from'
        required: true
        default: '1'

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Create branch
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let issue;

            if (context.eventName === 'issues') {
              issue = context.payload.issue;
            } else if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(context.payload.inputs.issue_number);
              const { data } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });
              issue = data;
            }

            console.log(`Issue Number: ${issue.number}`);
            
            function isValidBranchName(name){
                if (!name){
                    console.log("Branch name is empty");
                    return false;
                }
                
                if (!/^[a-zA-Z][a-zA-Z0-9.-_/]*$/.test(name)) {
                    console.log("Branch name is invalid");
                    return false;
                }
                if (name.startsWith("refs/")) {
                    console.log("Branch name starts with 'refs/'");
                    return false;
                }
                if (/[0-9A-F]{40}$/.test(name)) {
                    console.log("Branch name is a commit hash");
                    return false;
                }
                
                return true;
            }
                
            const issueTitle = issue.title.trim();
            console.log(`Issue Title: ${JSON.stringify(issueTitle)}`);
            const fallbackBranchName = `issue-${issue.number}`;
            
            const branchName = isValidBranchName(issueTitle)
              ? issueTitle
              : fallbackBranchName;

            console.log(`Branch Name: ${branchName}`);
    