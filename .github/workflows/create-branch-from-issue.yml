name: Create branch from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Create branch
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issueTitle = issue.title.trim();
            const fallbackBranchName = `issue-${issue.number}`;

            # Gitのブランチ名として危険な文字・形式を判定
            function isValidBranchName(name) {
              if (!name) return false;

              // 空白を含む場合は避ける
              if (/\s/.test(name)) return false;

              // Gitで問題になる文字・パターン
              if (name.includes('..')) return false;
              if (name.includes('//')) return false;
              if (name.endsWith('/')) return false;
              if (name.endsWith('.')) return false;
              if (name.endsWith('.lock')) return false;
              if (name.includes('@{')) return false;
              if (name === '@') return false;

              // Git refnameで使用不可・危険な文字
              if (/[~^:?*\[\]\\]/.test(name)) return false;

              // 制御文字
              if (/[\x00-\x20\x7f]/.test(name)) return false;

              return true;
            }

            const branchName = isValidBranchName(issueTitle)
              ? issueTitle
              : fallbackBranchName;

            const { data: repoData } = await github.rest.repos.get({
              owner,
              repo,
            });

            const defaultBranch = repoData.default_branch;

            const { data: refData } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${defaultBranch}`,
            });

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branchName}`,
                sha: refData.object.sha,
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `ブランチ \`${branchName}\` を作成しました。`,
              });
            } catch (error) {
              if (error.status === 422) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `ブランチ \`${branchName}\` はすでに存在している可能性があります。`,
                });
              } else {
                throw error;
              }
            }